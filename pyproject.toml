[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nsw-localize"
version = "0.1.0"
description = "Safe command-line extraction wrapper for NSTool"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nsw-localize contributors" }]
dependencies = []

[dependency-groups]
dev = ["ruff>=0.8"]

[project.scripts]
nsl = "nsw_localize.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nsw_localize"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
ignore = ["UP035", "UP045"]
